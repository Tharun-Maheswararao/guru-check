<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guru Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="hud">
  <a class="logo" href="#/">GURU CHECK</a>
  <nav>
    <a data-nav="library" href="#/">Traders</a>
    <a data-nav="room" id="nav-room">Talk</a>
    <a data-nav="sim" id="nav-sim">Race</a>
  </nav>
  <div class="nfa" title="Not financial advice, a test of what the video claims.">NOT FINANCIAL ADVICE</div>
</header>

<main id="view"></main>

<footer class="foot">Not financial advice, a test of what the video claims. NPCs are fictional characters, not the video creators.</footer>

<div id="birth" class="summon hidden">
  <div class="summon-glow"></div>
  <h1 class="summon-title">SUMMONING<span>...</span></h1>
  <div class="circle-wrap">
    <svg class="magic" width="500" height="500" viewBox="0 0 500 500" aria-hidden="true">
      <circle cx="250" cy="250" r="236" fill="none" stroke="#FF3D7F" stroke-width="3" stroke-opacity="0.7"/>
      <circle cx="250" cy="250" r="214" fill="none" stroke="#FF3D7F" stroke-width="10" stroke-dasharray="4 18" stroke-opacity="0.8"/>
      <circle cx="250" cy="250" r="186" fill="none" stroke="#FFD23F" stroke-width="2" stroke-opacity="0.8"/>
      <polygon points="250,70 406,340 94,340" fill="none" stroke="#FF3D7F" stroke-width="2.5" stroke-opacity="0.6"/>
      <polygon points="250,430 94,160 406,160" fill="none" stroke="#FF3D7F" stroke-width="2.5" stroke-opacity="0.6"/>
      <path d="M250 14 L256 30 L250 46 L244 30 Z M250 454 L256 470 L250 486 L244 470 Z M14 250 L30 244 L46 250 L30 256 Z M454 250 L470 244 L486 250 L470 256 Z" fill="#FFD23F"/>
    </svg>
    <div class="core" id="birth-sprite">?</div>
    <div class="orbit" id="birth-tl"></div>
  </div>
  <div class="summon-progress">
    <div class="segs" id="birth-steps"></div>
    <div class="step-label" id="birth-label">Opening the video</div>
    <div class="step-count" id="birth-count"></div>
    <div id="birth-error" class="err"></div>
  </div>
  <button class="pill ghost summon-close" id="birth-close">CLOSE</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
